<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sogol Ghasemi | UI/UX &amp; Web Designer</title>
<style>
:root{--bg:#f6f4ef;--ink:#1d1d1f;--muted:#6b6b72;--accent:#c4501f;--card:#fff;--line:#e4e1d9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"Vazirmatn",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
nav.top{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
nav.top a{color:var(--ink);text-decoration:none;font-size:.95rem}
nav.top a:hover,nav.top a.on{color:var(--accent)}
header.hero{padding:60px 0 30px}
header.hero h1{font-size:clamp(2rem,6vw,3.2rem);letter-spacing:-.02em}
header.hero p{color:var(--muted);max-width:40em;margin-top:12px}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:26px}
.skills div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.skills h3{font-size:1rem;margin-bottom:8px}
.skills span{display:inline-block;margin:0 6px 6px 0;padding:3px 11px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:.88rem}
h2{font-size:1.5rem;margin:48px 0 8px}
h2 + p.sub{color:var(--muted);margin-bottom:18px}
h3.group{font-size:1.1rem;margin:30px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;display:block;background:#eee}
.card img.tall{aspect-ratio:auto;object-fit:contain;background:#fff}
.card .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h4{font-size:1.05rem}
.card .tags{color:var(--muted);font-size:.88rem}
.card .actions{margin-top:auto;padding-top:10px;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:9px 16px;border-radius:8px;text-decoration:none;font-size:.92rem;font-weight:600;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.placeholder{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;background:#ece9e1;color:var(--muted);font-size:.92rem;text-align:center;padding:14px}
.note{color:var(--muted);font-size:.92rem;margin-top:10px}
.cat{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:10px}
.cat .card img{aspect-ratio:4/3}
footer{border-top:1px solid var(--line);margin-top:60px;padding:30px 0;color:var(--muted);font-size:.92rem}

.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:22px 0}
.gal img{width:100%;border-radius:14px;border:1px solid var(--line);background:#fff;display:block}
.gal .ph{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;background:#ece9e1;border-radius:14px;color:var(--muted);font-size:.92rem;text-align:center;padding:12px}
.pal{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.pal div{width:86px;font-size:.75rem;color:var(--muted)}
.pal span{display:block;height:56px;border-radius:12px;border:1px solid var(--line);margin-bottom:4px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:18px 0}
.meta div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.meta b{display:block;font-size:.85rem;color:var(--muted);font-weight:500}
.actions2{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}
.card .actions .btn{flex:1;text-align:center}
</style>
</head>
